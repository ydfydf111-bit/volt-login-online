<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password • Volt</title>
<style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;background:#08101e;color:white}.box{width:min(420px,90%);padding:30px;border:1px solid #ffffff22;border-radius:20px;background:#111b30}input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px}input{background:#091122;color:white;border:1px solid #334561}button{border:0;background:#62e6ff;font-weight:800}</style>
<div class="box"><h1>Reset password</h1><input id="p" type="password" minlength="12" placeholder="New password (12+ chars)"><button id="b">Reset</button><p id="m"></p></div>
<script>document.querySelector("#b").onclick=async()=>{const t=new URLSearchParams(location.search).get("token");const p=document.querySelector("#p").value;const r=await fetch("/api/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,password:p})});const d=await r.json();document.querySelector("#m").textContent=d.message||d.error}</script>
